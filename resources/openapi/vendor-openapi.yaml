openapi: 3.0.3
info:
  title: Eproc Vendor API
  description: |
    API documentation for the E-Procurement Vendor Portal.

    **Authentication:** Use Bearer JWT token (from guard `vendor`) in the `Authorization` header:
    `Authorization: Bearer <token>`

    Obtain a token via `/api/vendor/auth/login`.
  version: 1.0.0
  contact:
    name: Eproc Team

servers:
  - url: /
    description: Current server
  - url: http://localhost:8000
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Pagination:
      type: object
      properties:
        total:
          type: integer
          example: 100
        per_page:
          type: integer
          example: 10
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 10

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: No data

    ValidationError:
      type: object
      properties:
        status:
          type: boolean
          example: false
        message:
          type: string
          example: "Error Validation on npwp : The npwp field is required."
        result:
          type: object

    Province:
      type: object
      properties:
        id:
          type: integer
          example: 11
        name:
          type: string
          example: DKI Jakarta
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    City:
      type: object
      properties:
        id:
          type: integer
          example: 1
        province_id:
          type: integer
          example: 11
        name:
          type: string
          example: Kota Administrasi Jakarta Selatan
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        province:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 11
            name:
              type: string
              example: DKI Jakarta

    Vendor:
      type: object
      properties:
        id:
          type: integer
          example: 1
        npwp:
          type: string
          example: "01.234.567.8-901.000"
        company_name:
          type: string
          example: PT Maju Bersama Sejahtera
        phone:
          type: string
          nullable: true
          example: "0215551234"
        pic:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: info@majubersama.co.id
        address:
          type: string
          nullable: true
          example: Jl. Jend. Sudirman Kav. 52-53
        province_id:
          type: integer
          nullable: true
          example: 11
        city_id:
          type: integer
          nullable: true
          example: 1
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        province:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 11
            name:
              type: string
              example: DKI Jakarta
        city:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 1
            province_id:
              type: integer
              example: 11
            name:
              type: string
              example: Kota Administrasi Jakarta Selatan

    VendorUser:
      type: object
      properties:
        id:
          type: integer
          example: 1
        vendor_id:
          type: integer
          example: 1
        name:
          type: string
          example: Budi Santoso
        username:
          type: string
          nullable: true
          example: budisantoso
        email:
          type: string
          format: email
          example: budi@majubersama.co.id
        phone:
          type: string
          nullable: true
          example: "081234567890"
        photo_url:
          type: string
          nullable: true
        is_active:
          type: boolean
          example: true
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        last_login:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VendorOwner:
      type: object
      properties:
        id:
          type: integer
          example: 1
        vendor_id:
          type: integer
          example: 1
        name:
          type: string
          example: Budi Santoso
        ktp_number:
          type: string
          example: "3171012345670001"
        npwp_number:
          type: string
          example: "01.234.567.8-901.000"
        address:
          type: string
          example: Jl. Sudirman No. 10, Jakarta Selatan
        percentage:
          type: number
          format: float
          example: 60.0
        photo_path:
          type: string
          nullable: true
          example: vendor/pemilik/photo_abc123.jpg
        npwp_path:
          type: string
          nullable: true
          example: vendor/pemilik/npwp_abc123.pdf
        ktp_path:
          type: string
          nullable: true
          example: vendor/pemilik/ktp_abc123.jpg
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VendorCommissioner:
      type: object
      properties:
        id:
          type: integer
          example: 1
        vendor_id:
          type: integer
          example: 1
        name:
          type: string
          example: Hendra Wijaya
        npwp_number:
          type: string
          example: "01.234.567.8-901.000"
        position:
          type: string
          example: Komisaris Utama
        photo_path:
          type: string
          nullable: true
          example: vendor/komisaris/photo_abc123.jpg
        npwp_path:
          type: string
          nullable: true
          example: vendor/komisaris/npwp_abc123.pdf
        ktp_path:
          type: string
          nullable: true
          example: vendor/komisaris/ktp_abc123.jpg
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VendorDirector:
      type: object
      properties:
        id:
          type: integer
          example: 1
        vendor_id:
          type: integer
          example: 1
        name:
          type: string
          example: Agus Pratama
        ktp_number:
          type: string
          example: "3171012345670002"
        npwp_number:
          type: string
          example: "01.234.567.8-901.000"
        position:
          type: string
          example: Direktur Utama
        is_pic:
          type: boolean
          example: true
        photo_path:
          type: string
          nullable: true
          example: vendor/direksi/photo_abc123.jpg
        npwp_path:
          type: string
          nullable: true
          example: vendor/direksi/npwp_abc123.pdf
        ktp_path:
          type: string
          nullable: true
          example: vendor/direksi/ktp_abc123.jpg
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EducationLevel:
      type: object
      properties:
        id:
          type: integer
          example: 7
        name:
          type: string
          example: D4/S1
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VendorExpert:
      type: object
      properties:
        id:
          type: integer
          example: 1
        vendor_id:
          type: integer
          example: 1
        name:
          type: string
          example: Ir. Rina Kartika
        birth_place:
          type: string
          example: Bandung
        birth_date:
          type: string
          format: date
          example: "1990-05-15"
        position:
          type: string
          example: Tenaga Ahli Sipil
        npwp_number:
          type: string
          example: "01.234.567.8-901.000"
        ktp_number:
          type: string
          example: "3273012345670001"
        address:
          type: string
          example: Jl. Dago No. 10, Bandung
        education_level_id:
          type: integer
          example: 7
        education_level:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 7
            name:
              type: string
              example: D4/S1
        major:
          type: string
          example: Teknik Sipil
        diploma_number:
          type: string
          example: IJZ-2013-00123
        experience_years:
          type: integer
          example: 8
        photo_path:
          type: string
          nullable: true
          example: vendor/tenaga-ahli/photo_abc123.jpg
        diploma_path:
          type: string
          nullable: true
          example: vendor/tenaga-ahli/diploma_abc123.pdf
        certificate_path:
          type: string
          nullable: true
          example: vendor/tenaga-ahli/certificate_abc123.pdf
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VendorFinancial:
      type: object
      properties:
        id:
          type: integer
          example: 1
        vendor_id:
          type: integer
          example: 1
        report_date:
          type: string
          format: date
          example: "2025-12-31"
        fixed_assets:
          type: number
          format: float
          example: 1500000000
        current_assets:
          type: number
          format: float
          example: 750000000
        other_assets:
          type: number
          format: float
          example: 100000000
        long_term_liabilities:
          type: number
          format: float
          example: 300000000
        short_term_liabilities:
          type: number
          format: float
          example: 200000000
        capital:
          type: number
          format: float
          example: 1000000000
        net_worth:
          type: number
          format: float
          example: 1850000000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaxType:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: PPh Pasal 21
        is_spt:
          type: boolean
          example: true
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VendorTax:
      type: object
      properties:
        id:
          type: integer
          example: 1
        vendor_id:
          type: integer
          example: 1
        report_date:
          type: string
          format: date
          example: "2025-12-31"
        tax_id:
          type: integer
          example: 1
        tax:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: PPh Pasal 21
            is_spt:
              type: boolean
              example: true
        receipt_number:
          type: string
          example: BPE-2025-00123
        receipt_path:
          type: string
          nullable: true
          example: vendor/pajak/receipt_abc123.pdf
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VendorLegal:
      type: object
      properties:
        id:
          type: integer
          example: 1
        vendor_id:
          type: integer
          example: 1
        establishment_date:
          type: string
          format: date
          example: "2020-01-15"
        establishment_deed_number:
          type: string
          example: AHU-00123.AH.01.01.TAHUN 2020
        establishment_notary:
          type: string
          example: Notaris Andi SH, M.Kn
        establishment_deed_path:
          type: string
          nullable: true
          example: vendor/hukum/akta_pendirian.pdf
        amendment_date:
          type: string
          format: date
          nullable: true
          example: "2023-06-10"
        amendment_deed_number:
          type: string
          nullable: true
          example: AHU-00456.AH.01.02.TAHUN 2023
        amendment_notary:
          type: string
          nullable: true
          example: Notaris Budi SH, M.Kn
        amendment_deed_path:
          type: string
          nullable: true
          example: vendor/hukum/akta_perubahan.pdf
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VendorRegisterRequest:
      type: object
      required: [npwp, company_name, pic, email, password]
      properties:
        npwp:
          type: string
          example: "01.234.567.8-901.000"
        company_name:
          type: string
          example: PT Maju Bersama Sejahtera
        phone:
          type: string
          nullable: true
          example: "0215551234"
        pic:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: info@majubersama.co.id
        address:
          type: string
          nullable: true
          example: Jl. Jend. Sudirman Kav. 52-53
        province_id:
          type: integer
          nullable: true
          example: 11
        city_id:
          type: integer
          nullable: true
          example: 1
        name:
          type: string
          nullable: true
          description: Initial user full name (defaults to pic)
          example: Budi Santoso
        username:
          type: string
          nullable: true
          example: budisantoso
        user_email:
          type: string
          format: email
          nullable: true
          description: Initial user email (defaults to company email)
        user_phone:
          type: string
          nullable: true
          example: "081234567890"
        password:
          type: string
          format: password
          minLength: 6
          example: secret123
        callback_url:
          type: string
          nullable: true
          description: Optional frontend verification URL (defaults to backend /api/vendor/auth/verify)
          example: http://localhost:3000/vendor/verify

    VendorLoginRequest:
      type: object
      required: [password]
      properties:
        login:
          type: string
          description: Email or username (can also pass `email` or `username` field)
          example: info@majubersama.co.id
        email:
          type: string
          format: email
          example: info@majubersama.co.id
        password:
          type: string
          format: password
          example: secret123

    VendorLoginResponse:
      type: object
      properties:
        message:
          type: string
          example: Login successful
        result:
          type: object
          properties:
            id:
              type: integer
              example: 1
            vendor_id:
              type: integer
              example: 1
            name:
              type: string
              example: Budi Santoso
            username:
              type: string
              nullable: true
              example: budisantoso
            email:
              type: string
              example: info@majubersama.co.id
            phone:
              type: string
              nullable: true
              example: "081234567890"
            photo_url:
              type: string
              nullable: true
            is_active:
              type: boolean
              example: true
            last_login:
              type: string
              format: date-time
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            vendor:
              $ref: '#/components/schemas/Vendor'

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        default: 10
    AllParam:
      name: all
      in: query
      schema:
        type: boolean
        default: false
    SearchParam:
      name: search
      in: query
      schema:
        type: string
    PathIntegerId:
      name: id
      in: path
      required: true
      schema:
        type: integer

security:
  - bearerAuth: []

tags:
  - name: Vendor Auth
    description: Vendor registration, login, activation, and password recovery
  - name: Vendor Profile
    description: Authenticated vendor user profile and password management
  - name: Vendor Company
    description: Vendor company profile details (NPWP, address, PIC, province, city)
  - name: Vendor Team Users
    description: Manage multiple user accounts under the authenticated vendor
  - name: Vendor Owners
    description: Manage company owners (pemilik PT) under the authenticated vendor
  - name: Vendor Commissioners
    description: Manage company commissioners (komisaris) under the authenticated vendor
  - name: Vendor Directors
    description: Manage company board of directors (direksi) under the authenticated vendor
  - name: Vendor Experts
    description: Manage company experts (tenaga ahli) under the authenticated vendor
  - name: Vendor Financials
    description: Manage company financial statements (data keuangan) under the authenticated vendor
  - name: Vendor Taxes
    description: Manage company tax reports (manajemen pajak) under the authenticated vendor
  - name: Vendor Legals
    description: Manage company legal deeds (data hukum pendirian & perubahan) under the authenticated vendor
  - name: Master Education Level
    description: Master education levels (pendidikan terakhir)
  - name: Master Region
    description: Master provinces and cities (with filter city by province_id)
  - name: Master Tax Type
    description: Master tax types (jenis pajak)

x-tagGroups:
  - name: Authentication
    tags:
      - Vendor Auth
      - Vendor Profile
  - name: Organization
    tags:
      - Vendor Company
      - Vendor Team Users
      - Vendor Owners
      - Vendor Commissioners
      - Vendor Directors
      - Vendor Experts
      - Vendor Financials
      - Vendor Taxes
      - Vendor Legals
  - name: Master Data
    tags:
      - Master Region
      - Master Education Level
      - Master Tax Type

paths:
  /api/vendor/auth/register:
    post:
      tags: [Vendor Auth]
      summary: Register new vendor and initial vendor user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRegisterRequest'
      responses:
        '201':
          description: Vendor registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success register vendor
                  result:
                    type: object
                    properties:
                      vendor:
                        $ref: '#/components/schemas/Vendor'
                      user:
                        $ref: '#/components/schemas/VendorUser'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/vendor/auth/login:
    post:
      tags: [Vendor Auth]
      summary: Vendor user login
      description: Authenticates against `vendor_users` table, checks `is_active` status, updates `last_login`, and returns JWT token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorLoginRequest'
      responses:
        '201':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorLoginResponse'
        '400':
          description: Invalid credentials
        '403':
          description: Account or vendor is inactive

  /api/vendor/auth/me:
    get:
      tags: [Vendor Auth]
      summary: Get current authenticated vendor user
      responses:
        '201':
          description: Current vendor user profile and company info
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User profile
                  result:
                    $ref: '#/components/schemas/VendorUser'

  /api/vendor/auth/logout:
    get:
      tags: [Vendor Auth]
      summary: Logout vendor user
      responses:
        '201':
          description: Logged out successfully

  /api/vendor/auth/verify:
    get:
      tags: [Vendor Auth]
      summary: Verify vendor account via email link
      description: Clicking the verification link activates the vendor user (`is_active = true`, `email_verified_at = now()`) so the user can immediately log in.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
      responses:
        '201':
          description: Account verified and activated
        '400':
          description: Verification link invalid or expired
    post:
      tags: [Vendor Auth]
      summary: Verify vendor account via token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Account verified and activated
        '400':
          description: Verification link invalid or expired

  /api/vendor/auth/resend-verification:
    post:
      tags: [Vendor Auth]
      summary: Resend email verification link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                callback_url:
                  type: string
      responses:
        '201':
          description: Verification email sent
        '400':
          description: Account already verified

  /api/vendor/auth/forgot_password/send:
    post:
      tags: [Vendor Auth]
      summary: Send forgot password link to vendor user email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                callback_url:
                  type: string
      responses:
        '201':
          description: Reset link sent

  /api/vendor/auth/forgot_password/check_token:
    post:
      tags: [Vendor Auth]
      summary: Verify forgot password reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token]
              properties:
                email:
                  type: string
                token:
                  type: string
      responses:
        '201':
          description: Token is valid

  /api/vendor/auth/forgot_password/update_password:
    post:
      tags: [Vendor Auth]
      summary: Reset vendor user password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password]
              properties:
                email:
                  type: string
                token:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 6
      responses:
        '201':
          description: Password updated

  /api/vendor/province:
    get:
      tags: [Master Region]
      summary: List provinces
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/AllParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '201':
          description: List of provinces
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success get list province
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Province'
                  paginate:
                    $ref: '#/components/schemas/Pagination'

  /api/vendor/province/{id}:
    get:
      tags: [Master Region]
      summary: Get province detail
      security: []
      parameters:
        - $ref: '#/components/parameters/PathIntegerId'
      responses:
        '201':
          description: Province detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                  result:
                    $ref: '#/components/schemas/Province'

  /api/vendor/city:
    get:
      tags: [Master Region]
      summary: List cities (supports filter by province_id)
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/AllParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: province_id
          in: query
          description: Filter cities by province ID
          schema:
            type: integer
        - name: filter[province_id]
          in: query
          description: Filter cities by province ID (alternative syntax)
          schema:
            type: integer
      responses:
        '201':
