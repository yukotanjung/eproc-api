        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Classification not found

    delete:
      tags: [Classification]
      summary: Delete
      description: Soft delete classification record. Requires `classification_delete` permission.
      parameters:
        - $ref: '#/components/parameters/PathIntegerId'
      responses:
        '201':
          description: Classification deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success delete classification
                  result:
                    nullable: true
        '403':
          description: Classification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── PROCUREMENT METHOD ─────────────────────────────────────────────────────

  /api/procurement-method:
    get:
      tags: [Procurement Method]
      summary: List
      description: Retrieve paginated or full list of procurement methods with stage counts. Supports filtering and search. Requires `procurement_method_read` permission.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/AllParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: filter[name]
          in: query
          description: Filter by method name
          schema:
            type: string
        - name: filter[description]
          in: query
          description: Filter by description
          schema:
            type: string
      responses:
        '201':
          description: Procurement methods retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success get list procurement method
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProcurementMethod'
                  paginate:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

    post:
      tags: [Procurement Method]
      summary: Create
      description: Create a procurement method. A new method starts with zero stages. Requires `procurement_method_create` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: Tender
                description:
                  type: string
                  maxLength: 500
                  nullable: true
                  example: Open competitive selection method
      responses:
        '201':
          description: Procurement method created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success create procurement method
                  result:
                    $ref: '#/components/schemas/ProcurementMethod'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Creation failed

  /api/procurement-method/{id}:
    get:
      tags: [Procurement Method]
      summary: Get details
      description: Retrieve a single procurement method with its full stage list ordered by `sequence`. Requires `procurement_method_read` permission.
      parameters:
        - $ref: '#/components/parameters/PathIntegerId'
      responses:
        '201':
          description: Procurement method retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                  result:
                    $ref: '#/components/schemas/ProcurementMethodDetail'
        '403':
          description: Method not found

    post:
      tags: [Procurement Method]
      summary: Update
      description: Update a procurement method. Omitted `is_active` keeps the current value. Requires `procurement_method_update` permission.
      parameters:
        - $ref: '#/components/parameters/PathIntegerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: Tender
                description:
                  type: string
                  maxLength: 500
                  nullable: true
                  example: Open competitive selection method
                is_active:
                  type: boolean
                  example: true
      responses:
        '201':
          description: Procurement method updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success update procurement method
                  result:
                    $ref: '#/components/schemas/ProcurementMethod'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Method not found

    delete:
      tags: [Procurement Method]
      summary: Delete
      description: Soft delete a procurement method together with all of its stages. Requires `procurement_method_delete` permission.
      parameters:
        - $ref: '#/components/parameters/PathIntegerId'
      responses:
        '201':
          description: Procurement method deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success delete procurement method
                  result:
                    nullable: true
                    example: null
        '403':
          description: Method not found

  /api/procurement-method/{id}/stage:
    get:
      tags: [Procurement Method Stage]
      summary: List stages
      description: Retrieve every stage of a method ordered by `sequence`. Requires `procurement_method_read` permission.
      parameters:
        - $ref: '#/components/parameters/PathIntegerId'
      responses:
        '201':
          description: Stages retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success get list procurement method stage
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProcurementMethodStage'
        '403':
          description: Method not found

    post:
      tags: [Procurement Method Stage]
      summary: Create stage
      description: |
        Append a stage to a method. `sequence` is assigned by the server as `max + 1`;
        any client-sent `sequence` is ignored. Use the reorder endpoint to change the order.
        Requires `procurement_method_create` permission.
      parameters:
        - $ref: '#/components/parameters/PathIntegerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcurementMethodStageInput'
      responses:
        '201':
          description: Stage created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success create procurement method stage
                  result:
                    $ref: '#/components/schemas/ProcurementMethodStage'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Method not found

  /api/procurement-method/{id}/stage/reorder:
    post:
      tags: [Procurement Method Stage]
      summary: Reorder stages
      description: |
        Rewrite `sequence` to 1..N following the given id order. `stage_ids` must contain
        exactly all stage ids of the method; an incomplete list is rejected with 400.
        Requires `procurement_method_update` permission.
      parameters:
        - $ref: '#/components/parameters/PathIntegerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage_ids]
              properties:
                stage_ids:
                  type: array
                  minItems: 1
                  description: Complete list of stage ids, first element becomes sequence 1.
                  items:
                    type: integer
                  example: [3, 1, 2]
      responses:
        '201':
          description: Stages reordered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success reorder procurement method stage
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProcurementMethodStage'
        '400':
          description: Validation error or incomplete stage id list
        '403':
          description: Method not found

  /api/procurement-method/{id}/stage/{stageId}:
    post:
      tags: [Procurement Method Stage]
      summary: Update stage
      description: Update a stage scoped to its method. `sequence` cannot be changed here. Requires `procurement_method_update` permission.
      parameters:
        - $ref: '#/components/parameters/PathIntegerId'
        - $ref: '#/components/parameters/PathStageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcurementMethodStageInput'
      responses:
        '201':
          description: Stage updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success update procurement method stage
                  result:
                    $ref: '#/components/schemas/ProcurementMethodStage'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Method or stage not found

    delete:
      tags: [Procurement Method Stage]
      summary: Delete stage
      description: |
        Soft delete a stage and compact the remaining `sequence` values back to 1..N.
        Requires `procurement_method_delete` permission.
      parameters:
        - $ref: '#/components/parameters/PathIntegerId'
        - $ref: '#/components/parameters/PathStageId'
      responses:
        '201':
          description: Stage deleted successfully
        '403':
          description: Method or stage not found

  /api/procurement-method/{id}/preview-schedule:
    post:
      tags: [Procurement Method Stage]
      summary: Preview schedule
      description: |
        Derive the effective open window of every active stage from a start date.
        Nothing is stored. `calendar` stages add literal days, `working_day` stages
        add Mon-Fri days only. Requires `procurement_method_read` permission.
      parameters:
        - $ref: '#/components/parameters/PathIntegerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date]
              properties:
                start_date:
                  type: string
                  format: date
                  example: '2026-01-05'
      responses:
        '201':
          description: Schedule preview generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success preview procurement method schedule
                  result:
                    $ref: '#/components/schemas/ProcurementMethodSchedule'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Method not found

  # ─── PROFILE ────────────────────────────────────────────────────────────────

  /api/profile:
    get:
      tags: [Profile]
      summary: Get personal profile
      description: Retrieve authenticated user profile and account details.
      responses:
        '201':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success get profile
                  result:
                    $ref: '#/components/schemas/User'

  /api/profile/update-password:
    post:
      tags: [Profile]
      summary: Change account password
      description: Update password for currently authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 6
      responses:
        '201':
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success update password
        '400':
          description: Validation error
        '403':
          description: Old password incorrect or account not found

  /api/profile/update-profile:
    post:
      tags: [Profile]
      summary: Update personal profile
      description: Update profile name, photo, or email address. Dispatches verification email if email address changed.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, email, callback_url]
              properties:
                name:
                  type: string
                  example: Jane Doe
                username:
                  type: string
                  example: janedoe
                employee_code:
                  type: string
                  nullable: true
                  example: EMP001
                email:
                  type: string
                  format: email
                  example: jane.doe@example.com
                callback_url:
                  type: string
                  description: Frontend verification URL
                photo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success update profile
                  result:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
        '403':
          description: Account not found

  /api/profile/update-notification-device:
    post:
      tags: [Profile]
      summary: Update push notification device token
      description: Register device token for receiving push notifications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notification_device]
              properties:
                notification_device:
                  type: string
                  example: fcm_token_string_here
      responses:
        '201':
          description: Notification device updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success update notification
                  result:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
        '403':
          description: Account not found
