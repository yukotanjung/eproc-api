openapi: 3.0.3
info:
  title: Eproc API
  description: |
    API documentation for the E-Procurement System.

    **Authentication:** Use Bearer JWT token in the `Authorization` header:
    `Authorization: Bearer <token>`
    
    Obtain a token via `/api/auth/login`.
  version: 1.0.0
  contact:
    name: Eproc Team

servers:
  - url: /
    description: Current server
  - url: http://localhost:8000
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Pagination:
      type: object
      properties:
        total:
          type: integer
          example: 100
        per_page:
          type: integer
          example: 10
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 10

    BaseResponse:
      type: object
      properties:
        message:
          type: string
          example: Success
        result:
          nullable: true

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: No data

    ValidationError:
      type: object
      properties:
        status:
          type: boolean
          example: false
        message:
          type: string
          example: "Error Validation on name : The name field is required."
        result:
          type: object

    # Auth Schemas
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@eproc.com
        password:
          type: string
          format: password
          example: "secret123"

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: Login successful
        result:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              example: Administrator
            username:
              type: string
              example: admin
            employee_code:
              type: string
              nullable: true
              example: EMP001
            email:
              type: string
              example: admin@eproc.com
            photo_url:
              type: string
              nullable: true
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            roles:
              type: array
              items:
                type: object

    # Permission Schemas
    Permission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Manage User
        subject:
          type: string
          example: user
        action:
          type: string
          example: read
        permission:
          type: string
          example: user_read

    # Role Schemas
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Admin
        description:
          type: string
          nullable: true
          example: System Administrator
        total_permissions:
          type: integer
          example: 12
        total_users:
          type: integer
          example: 4
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RoleDetail:
      allOf:
        - $ref: '#/components/schemas/Role'
        - type: object
          properties:
            permissions:
              type: array
              items:
                $ref: '#/components/schemas/Permission'

    # User Schemas
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: John Doe
        username:
          type: string
          example: johndoe
        employee_code:
          type: string
          nullable: true
          example: EMP001
        email:
          type: string
          format: email
          example: john@example.com
        photo_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        role:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              example: Admin
            description:
              type: string
              nullable: true

    # Funding Source Schemas
    FundingSource:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: State Budget
        description:
          type: string
          nullable: true
          example: National state development budget
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Tax Schemas
    Tax:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: PPN 11%
        is_spt:
          type: boolean
          example: true
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Business Type Schemas
    BusinessType:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: General Trading
        description:
          type: string
          nullable: true
          example: Goods supply and trading services
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Work Unit Schemas
    WorkUnit:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Procurement Division
        code:
          type: string
          example: PROC-01
        description:
          type: string
          nullable: true
          example: Division in charge of procurement activities
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Qualification Schemas
    Qualification:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Small Enterprise (Kecil)
        description:
          type: string
          nullable: true
          example: Qualification criteria for small enterprise contractors
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Education Level Schemas
    EducationLevel:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Bachelor Degree (S1)
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Major Schemas
    Major:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Civil Engineering
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Job Type Schemas
    JobType:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Construction Work
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Job Field Schemas
    JobField:
      type: object
      properties:
        id:
          type: integer
          example: 1
        job_type_id:
          type: integer
          example: 1
        name:
          type: string
          example: Civil Infrastructure
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        job_type:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Construction Work

    # Classification Schemas
    Classification:
      type: object
      properties:
        id:
          type: integer
          example: 1
        job_type_id:
          type: integer
          example: 1
        job_field_id:
          type: integer
          example: 1
        name:
          type: string
          example: Road & Bridge Construction
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        job_type:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Construction Work
        job_field:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Civil Infrastructure


    # Procurement Method Schemas
    ProcurementMethod:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Tender
        description:
          type: string
          nullable: true
          example: Open competitive selection method
        is_active:
          type: boolean
          example: true
        stages_count:
          type: integer
          example: 5
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProcurementMethodDetail:
      allOf:
        - $ref: '#/components/schemas/ProcurementMethod'
        - type: object
          properties:
            stages:
              type: array
              items:
                $ref: '#/components/schemas/ProcurementMethodStage'

    ProcurementMethodStage:
      type: object
      description: |
        One step of a procurement method. `day_type` decides how `duration_days` is applied:
        `calendar` adds literal days, `working_day` adds Mon-Fri days only.
        `sequence` is 1-based and always contiguous per method.
      properties:
        id:
          type: integer
          example: 11
        procurement_method_id:
          type: integer
          example: 1
        sequence:
          type: integer
          example: 1
        name:
          type: string
          example: Pengumuman
        duration_days:
          type: integer
          example: 5
        day_type:
          type: string
          enum: [calendar, working_day]
          example: calendar
        requires_file:
          type: boolean
          description: When true the stage needs a file upload before it can be completed.
          example: false
        page_key:
          type: string
          description: Frontend page identifier rendered for this stage.
          example: procurement/stage/announcement
        process_key:
          type: string
          description: Backend process identifier executed for this stage.
          example: stage.announcement
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProcurementMethodStageInput:
      type: object
      required: [name, duration_days, day_type, page_key, process_key]
      properties:
        name:
          type: string
          maxLength: 150
          example: Evaluasi
        duration_days:
          type: integer
          minimum: 1
          maximum: 3650
          example: 3
        day_type:
          type: string
          enum: [calendar, working_day]
          example: working_day
        requires_file:
          type: boolean
          example: true
        page_key:
          type: string
          maxLength: 100
          example: procurement/stage/evaluation
        process_key:
          type: string
          maxLength: 100
          example: stage.evaluation
        description:
          type: string
          maxLength: 500
          nullable: true
        is_active:
          type: boolean
          description: Update only. Create always stores the stage as active.
          example: true

    ProcurementMethodScheduleStage:
      type: object
      properties:
        stage_id:
          type: integer
          example: 11
        sequence:
          type: integer
          example: 1
        name:
          type: string
          example: Pengumuman
        day_type:
          type: string
          enum: [calendar, working_day]
          example: calendar
        duration_days:
          type: integer
          example: 5
        start_date:
          type: string
          format: date
          example: '2026-01-05'
        end_date:
          type: string
          format: date
          description: Last day the stage is open.
          example: '2026-01-09'
        next_start_date:
          type: string
          format: date
          description: When the following stage opens.
          example: '2026-01-10'

    ProcurementMethodSchedule:
      type: object
      properties:
        start_date:
          type: string
          format: date
          example: '2026-01-05'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/ProcurementMethodScheduleStage'

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        default: 10
    AllParam:
      name: all
      in: query
      description: Retrieve all items without pagination
      schema:
        type: boolean
        default: false
    SearchParam:
      name: search
      in: query
      description: Search query keyword
      schema:
        type: string
    PathId:
      name: id
      in: path
      required: true
      description: Resource UUID
      schema:
        type: string
        format: uuid
    PathIntegerId:
      name: id
      in: path
      required: true
      description: Resource ID (autoincrement)
      schema:
        type: integer
    PathStageId:
      name: stageId
      in: path
      required: true
      description: Stage ID (autoincrement)
      schema:
        type: integer

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Authentication, password management, and account activation
  - name: Profile
    description: Current user profile and account preferences
  - name: Permission
    description: Permission management
  - name: Role
    description: Role and access control management
  - name: User
    description: User account management
  - name: Funding Source
    description: Funding source management
  - name: Tax
    description: Tax management
  - name: Business Type
    description: Business type management
  - name: Work Unit
    description: Work unit management
  - name: Qualification
    description: Qualification management
  - name: Education Level
    description: Education level management
  - name: Major
    description: Major and study field management
  - name: Job Type
    description: Job type and work classification management
  - name: Job Field
    description: Job field and specialized work area management
  - name: Classification
    description: Classification and sub-specialization management
  - name: Procurement Method
    description: Procurement method (metode pengadaan) and its ordered stages
  - name: Procurement Method Stage
    description: Stages of a procurement method, including scheduling rules

x-tagGroups:
  - name: Authentication
    tags:
      - Auth
      - Profile
  - name: User Management
    tags:
      - User
      - Role
      - Permission
  - name: Master
    tags:
      - Funding Source
      - Tax
      - Business Type
      - Work Unit
      - Qualification
      - Education Level
      - Major
      - Job Type
      - Job Field
      - Classification
      - Procurement Method
      - Procurement Method Stage

paths:

  # ─── AUTH ───────────────────────────────────────────────────────────────────

  /api/auth/login:
    post:
      tags: [Auth]
      summary: User login
      description: Authenticate user credentials and return JWT bearer token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Token creation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      description: Retrieve authenticated user profile information.
      responses:
        '201':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User profile
                  result:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      email:
                        type: string
                      last_login:
                        type: string
                        format: date-time
                        nullable: true

  /api/auth/logout:
    get:
      tags: [Auth]
      summary: User logout
      description: Invalidate active JWT token.
      responses:
        '201':
          description: Successfully signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User successfully signed out
                  result:
                    nullable: true

  /api/auth/activate:
    post:
      tags: [Auth]
      summary: Activate user account
      description: Activate newly created user account using verification token and set account password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password]
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 6
      responses:
        '201':
          description: Account activated successfully
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/auth/activate/check_token:
    post:
      tags: [Auth]
      summary: Verify activation token
      description: Check if account activation token is valid.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token]
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
      responses:
        '201':
          description: Token is valid
        '400':
          description: Token is invalid or expired

  /api/auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      description: Confirm updated email address with token sent via email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token]
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
      responses:
        '201':
          description: Email verified successfully
        '400':
          description: Invalid verification token

  /api/auth/forgot_password/send:
    post:
      tags: [Auth]
      summary: Send password reset link
      description: Send password reset token to registered email address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Password reset email sent successfully
        '400':
          description: Validation error

  /api/auth/forgot_password/check_token:
    post:
      tags: [Auth]
      summary: Verify password reset token
      description: Check if password reset token is valid.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token]
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
      responses:
        '201':
          description: Reset token is valid
        '400':
          description: Reset token is invalid or expired

  /api/auth/forgot_password/update_password:
    post:
      tags: [Auth]
      summary: Reset account password
      description: Update user password using validated reset token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password]
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 6
      responses:
        '201':
          description: Password reset successfully
        '400':
          description: Validation error

  # ─── PERMISSION ─────────────────────────────────────────────────────────────

  /api/permission:
    get:
      tags: [Permission]
      summary: List permissions
      description: Retrieve paginated list of permissions. Requires `permission_read` permission.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/AllParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '201':
          description: Permissions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success get list permissions
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
                  paginate:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/permission/group:
    get:
      tags: [Permission]
      summary: Grouped permissions
      description: Retrieve permissions grouped by module subject. Requires `permission_read` permission.
      responses:
        '201':
          description: Grouped permissions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        subject:
                          type: string
                          example: user
                        name:
                          type: string
                          example: Manage User
                        actions:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              action:
                                type: string
                                example: read

  /api/permission/{id}:
    get:
      tags: [Permission]
      summary: Get permission details
      description: Retrieve specific permission by ID. Requires `permission_read` permission.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '201':
          description: Permission retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                  result:
                    $ref: '#/components/schemas/Permission'
        '403':
          description: Permission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── ROLE ───────────────────────────────────────────────────────────────────

  /api/role:
    get:
      tags: [Role]
      summary: List roles
      description: Retrieve paginated list of user roles. Requires `role_read` permission.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/AllParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '201':
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success get list role
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
                  paginate:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

    post:
      tags: [Role]
      summary: Create role
      description: Create a new role with assigned permissions. Requires `role_create` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permission_ids]
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: Manager
                description:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: Department manager role
                permission_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: Role created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success create role
                  result:
                    $ref: '#/components/schemas/RoleDetail'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
