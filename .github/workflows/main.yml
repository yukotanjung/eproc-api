name: Build & Push to GHCR

on:
  push:
    branches:
      - development
      - staging
      - main
    paths:
      - "Dockerfile"
      - "**/*.php"
      - "composer.*"
      - "package*.json"
      - "dockerfiles/**"
      - ".github/workflows/main.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set tag based on branch
        id: vars
        run: |
          case "${GITHUB_REF_NAME}" in
            main)        echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
            staging)     echo "tag=stag-latest" >> "$GITHUB_OUTPUT" ;;
            development) echo "tag=dev-latest" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported branch: ${GITHUB_REF_NAME}"; exit 1 ;;
          esac

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
